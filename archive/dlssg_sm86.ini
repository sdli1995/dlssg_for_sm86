; Deploy only version.dll (or the alternative winmm.dll) and this INI beside the rendering EXE.
; DLSSG runtime, models and SM86 backend are embedded in the proxy DLL.
; Restart the process after changing settings.
[General]
Enabled=1

[FrameGeneration]
; Extra generated frames: 1=2x, 2=3x, 3=4x. 0=preserve runtime capability.
; This is an advertised maximum; the game chooses the actual count.
MaxGeneratedFrames=3

[Logging]
; 0=off, 1=errors, 2=configuration/capability, 3=kernel and evaluation traces.
Level=2
File=1
DebugOutput=0
EvaluateEvery=120
Directory=dlssg_sm86\logs

[Debug]
MarkGeneratedFrames=0
MarkerX=8
MarkerY=8
MarkerScale=2

[Compatibility]
; Auto: use cubin on actual SM86, PTX for other GPUs when routing is forced.
; PTX: use the SM86 PTX JIT path even on an RTX 3080 Ti / actual SM86.
; Cubin: require actual SM86 when routing is active. This setting does not enable routing.
KernelImage=Auto
; RTX 3080 Ti / actual SM86 is selected automatically; keep both options at 0.
ForceSM86Route=0
SimulateAmpere=0

[Runtime]
; Bundled: always use the embedded, matched runtime/backend. No game DLL version matching.
Mode=Bundled
; Empty uses %LOCALAPPDATA%\DlssgSm86\bundles. Relative paths are based on this INI.
CacheDirectory=
; Advanced only: Auto uses the game's DLL; Pinned uses Path. Neither is needed for normal use.
Path=

[Backends]
; Optional external profiles for Auto/Pinned. The bundled profile is built in; no entries needed.
